name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.module }}, fips140=${{ matrix.fips140 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", sdk/plugin, plugins/openbao]
        fips140: ["off", "on"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      # Build against Go's validated FIPS 140-3 module, as release builds
      # do. tc pins the mode off by default; the matrix sets it explicitly.
      GOFIPS140: certified
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test (race detector)
        env:
          GODEBUG: fips140=${{ matrix.fips140 }}
        # The e2e package alone runs close to go test's default 10m limit.
        run: go test -race -timeout 30m ./...
      # Running a Backend Plugin as a separate OS user needs a root server.
      - name: go test as root (Backend Plugin user separation)
        if: matrix.module == '.'
        env:
          GODEBUG: fips140=${{ matrix.fips140 }}
        run: >-
          sudo --preserve-env=GODEBUG,GOFIPS140 env
          "PATH=$PATH" "GOCACHE=$RUNNER_TEMP/root-gocache" "GOMODCACHE=$(go env GOMODCACHE)"
          GOPROXY=off GOTOOLCHAIN=local GOFLAGS=-buildvcs=false
          go test -race -count=1 -run '^TestBackendPlugin(RunsAs|MustRunAs)SeparateUser$' ./e2e
