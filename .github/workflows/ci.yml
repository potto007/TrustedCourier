name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_call:

permissions:
  contents: read

# Only superseded PR work is disposable. Never cancel main or queue evidence.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/test-wait-for-ci.py

  draft:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    name: draft feedback (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", sdk/plugin, plugins/openbao]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOFIPS140: certified
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...

  test:
    # Draft skips MUST NOT report success under the six required check names.
    name: ${{ github.event.pull_request.draft && 'draft deferred' || 'test' }} (${{ matrix.module }}, fips140=${{ matrix.fips140 }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", sdk/plugin, plugins/openbao]
        fips140: ["off", "on"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      # Build against Go's validated FIPS 140-3 module, as release builds
      # do. tc pins the mode off by default; the matrix sets it explicitly.
      GOFIPS140: certified
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test (race detector)
        env:
          GODEBUG: fips140=${{ matrix.fips140 }}
          # The OpenBao plugin's conformance test runs a real OpenBao
          # container with docker and must never silently skip in CI.
          TC_REQUIRE_OPENBAO: "1"
        # The e2e package alone runs close to go test's default 10m limit.
        run: go test -race -timeout 30m ./...
      # Running a Backend Plugin as a separate OS user needs a root server.
      - name: go test as root (Backend Plugin user separation)
        if: matrix.module == '.'
        env:
          GODEBUG: fips140=${{ matrix.fips140 }}
          TC_REQUIRE_OPENBAO: "1"
        run: >-
          sudo --preserve-env=GODEBUG,GOFIPS140,TC_REQUIRE_OPENBAO env
          "PATH=$PATH" "GOCACHE=$RUNNER_TEMP/root-gocache" "GOMODCACHE=$(go env GOMODCACHE)"
          GOPROXY=off GOTOOLCHAIN=local GOFLAGS=-buildvcs=false
          go test -race -count=1 -run '^(TestBackendPlugin(RunsAs|MustRunAs)SeparateUser|TestInitGivesTokenFileToPluginUser)$' ./e2e
